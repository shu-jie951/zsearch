<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在 - ZSEARCH</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=f80ad4af">
  <link rel="stylesheet" href="/static/css/base.css?v=7dbc642b">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      text-align: center;
      max-width: 420px;
    }

    .code {
      font-family: "YuMincho", "Songti SC", serif;
      font-size: 84px;
      line-height: 1;
      font-weight: 400;
      color: var(--text-strong);
      letter-spacing: -0.04em;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    p {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 20px;
      border-radius: 9999px;
      border: 1px solid var(--border-strong);
      font-size: 13.5px;
      color: var(--text-strong);
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-hover);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>这个页面找不到了</h1>
    <p>你访问的地址不存在，可能是链接输错了，或者页面已经被移动。</p>
    <a class="btn" href="/">返回搜索首页</a>
  </div>
</body>

</html>
