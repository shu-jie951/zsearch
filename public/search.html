<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="ZSEARCH 网盘资源搜索结果">
  <meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)">
  <title>搜索 - ZSEARCH</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=f80ad4af">
  <link rel="stylesheet" href="/static/css/base.css?v=57b2b93f">
  <link rel="stylesheet" href="/static/css/results.css?v=e64b58ee">
  <link rel="stylesheet" href="/static/css/wallpaper.css?v=a7cbedff">
  <link rel="stylesheet" href="/static/css/workbench.css?v=2c74e5db">
  <!-- 质感层：纯装饰性交互特效（卡片聚光 / 数字滚动 / 长列表渐入）。
       单独成一个文件，删掉它页面功能完全不受影响 —— 也就不会有人
       为了改一个光效去动 results.js 的渲染逻辑。 -->
  <link rel="stylesheet" href="/static/css/polish.css?v=003e5bf1">
</head>

<body class="results-body">

  <!-- 氛围层 -->
  <div class="atmosphere" aria-hidden="true">
    <div class="aura aura-1"></div>
    <div class="aura aura-2"></div>
    <div class="aura aura-3"></div>
    <div class="grid"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <!-- 顶部滚动进度（极细一条，位于最顶层） -->
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

  <header class="results-header">
    <div class="header-top">
      <div class="results-logo-container">
        <a href="/" class="results-logo" title="ZSEARCH 搜索">
          <!-- Same lockup as the home page: direction 2 "quiet paper" tile
               (#FBFAF9 + 18% ink hairline), ink Z, orange dot on the slash
               midpoint. Geometry and colours are identical to
               public/static/logo.svg, so the page mark and the desktop icon are
               the same object. See index.html for the full reasoning. -->
          <!-- viewBox width is set from the wordmark's measured advance:
               x=80 start + 286.97 for "ZSEARCH" at font-size 82 = 366.97, plus
               a few units of slack. Anything narrower clips the H's right stem,
               because the outermost <svg> clips to its viewport by default. -->
          <svg viewBox="0 0 374 88" version="1.1" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ZSEARCH">
            <g transform="translate(0,14) scale(0.46875)">
              <rect x="6" y="6" width="116" height="116" rx="28" fill="#FBFAF9"/>
              <rect x="6.9" y="6.9" width="114.2" height="114.2" rx="27.2" fill="none"
                    stroke="#16161A" stroke-opacity="0.18" stroke-width="1.8"/>
              <g transform="translate(21,21) scale(0.86)">
                <path d="M 0,0 L 100,0 L 100,20 L 31,80 L 100,80 L 100,100
                         L 0,100 L 0,80 L 69,20 L 0,20 Z" fill="#16161A"/>
                <circle cx="50" cy="50" r="8" fill="#E16C28"/>
              </g>
            </g>
            <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"
               font-family="YuMin-Medium, YuMincho, 'Songti SC', 'SimSun', serif" font-size="82" font-weight="400">
              <text fill="currentColor">
                <tspan x="80" y="72">ZSEARCH</tspan>
              </text>
            </g>
          </svg>
        </a>
      </div>

      <form class="results-search-form" id="resultsSearchForm" action="/search" method="GET">
        <input type="hidden" name="sort" id="sortField" value="latest">
        <input type="hidden" name="cloud" id="cloudField" value="all">

        <div class="results-ai-composer" id="resultsComposer">
          <span class="composer-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round"><circle cx="11" cy="11" r="7.5"></circle><path d="M16.5 16.5 21 21"></path></svg>
          </span>

          <input
            name="q"
            type="text"
            class="results-input-editor"
            id="resultsSearchInput"
            value=""
            placeholder="搜索资源…"
            aria-label="搜索"
            maxlength="50"
            autocomplete="off"
            spellcheck="false">

          <div class="results-actions">
            <button type="button" id="resultsClearBtn" class="results-voice-btn results-clear-btn"
                    aria-label="清空输入" title="清空（Esc）" hidden>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                   stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18"></path>
              </svg>
            </button>

            <button type="button" id="resultsVoiceBtn" class="results-voice-btn" aria-label="语音输入" title="按住或点击开始语音输入">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>

            <button type="submit" id="resultsSubmitBtn" class="results-send-btn" aria-label="搜索" title="开始搜索">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">
                <path d="M8.3125 0.980183C8.66767 1.0531 8.97902 1.20418 9.2627 1.43233C9.48724 1.61297 9.73029 1.85793 9.97949 2.10714L14.707 6.83468L13.293 8.24874L9 3.95577V15.0417H7V3.95577L2.70703 8.24874L1.29297 6.83468L6.02051 2.10714C6.26971 1.85793 6.51277 1.61297 6.7373 1.43233C6.97662 1.23986 7.28445 1.04402 7.6875 0.980183C7.8973 0.947006 8.1031 0.95516 8.3125 0.980183Z"/>
              </svg>
            </button>
          </div>
        </div>
      </form>

      <div class="results-topbar-actions">
        <a href="/" class="header-home-btn" title="返回搜索首页">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>首页</span>
        </a>
      </div>
    </div>

    <div class="header-nav-wrap">
      <nav class="header-nav" aria-label="筛选">
        <div class="cloud-tabs" id="cloudTabs">
          <a class="cloud-tab active" data-cloud="all" href="#">
            <svg class="tab-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
            </svg>全部
          </a>

          <a class="cloud-tab sort-toggle-capsule" id="sortToggle" href="#" title="点击切换排序">
            <svg class="tab-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="sortLabel">最新优先</span>
          </a>

          <div class="nav-divider"></div>

          <a class="cloud-tab" data-cloud="quark" href="#">
            <img src="/static/quark.png?v=1d7cb0ab" class="tab-icon" alt="" data-hide-on-error>夸克网盘
          </a>
          <a class="cloud-tab" data-cloud="baidu" href="#">
            <img src="/static/baidu.png?v=dd4063a0" class="tab-icon" alt="" data-hide-on-error>百度网盘
          </a>
          <a class="cloud-tab" data-cloud="uc" href="#">
            <img src="/static/uc.png?v=830a58eb" class="tab-icon" alt="" data-hide-on-error>UC网盘
          </a>
          <a class="cloud-tab" data-cloud="xunlei" href="#">
            <img src="/static/xunlei.png?v=ce568087" class="tab-icon" alt="" data-hide-on-error>迅雷云盘
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main class="results-main" id="resultsMain" data-query="" data-sort="latest" data-cloud="all">
    <div id="statsContainer" class="results-stats" style="display: none;"></div>
    <div class="result-list" id="resultList" aria-live="polite">
      <div class="result-loading" aria-hidden="true">
        <div class="loading-line title" style="width: 70%;"></div>
        <div class="loading-line snippet"></div>
        <div class="loading-line tags"></div>
      </div>
      <div class="result-loading" aria-hidden="true">
        <div class="loading-line title" style="width: 55%;"></div>
        <div class="loading-line snippet" style="width: 85%;"></div>
        <div class="loading-line tags" style="width: 25%;"></div>
      </div>
      <div class="result-loading" aria-hidden="true">
        <div class="loading-line title" style="width: 80%;"></div>
        <div class="loading-line snippet" style="width: 95%;"></div>
        <div class="loading-line tags" style="width: 40%;"></div>
      </div>
      <div class="result-loading" aria-hidden="true">
        <div class="loading-line title" style="width: 60%;"></div>
        <div class="loading-line snippet"></div>
        <div class="loading-line tags"></div>
      </div>
    </div>
  </main>

  <button type="button" id="backToTopBtn" class="back-to-top-btn" aria-label="返回顶部" title="返回顶部">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6"/>
    </svg>
  </button>

  <footer class="results-footer">
    <div class="footer-row">
      <span>© <span id="current-year"></span> ZSEARCH</span>
      <span class="dot-sep">•</span>
      <a href="/disclaimer">免责声明与使用条款</a>
    </div>
  </footer>

  <script src="/static/js/results.js?v=326e3272"></script>
  <script src="/static/js/wallpaper.js?v=7cbb861c"></script>
  <script src="/static/js/workbench.js?v=b06a071e"></script>
  <script src="/static/js/polish.js?v=5242f792"></script>
</body>

</html>
