<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="ZSEARCH">
  <title>ZSEARCH</title>

  <!-- ZSEARCH 品牌标记 —— 墨色 Z + 斜杠正中一个精确的橙点。

       不再用"深色方章 + 橙字"。站点 base.css 定的调性是 Quiet Premium：低饱和中性灰、
       大量留白、纸面感、只用一处极窄的暖橙点睛。厚重的深色块和这套气质是拧着的，
       而且"圆角方块 + 里面一个字母"是所有 App 的通用格式，越标准越没有辨识度。
       现在的做法是不套壳、让字形自己站住：纸色底 + 墨色字 + 一个橙点。 -->

  <!-- 纸色底。站点页面背景本身就是 #FBFAF9，所以网页上是"裸标浮在纸上"；
       图标里则是同一张纸 —— 两边是同一个东西，不需要第二套设计。
       一条 18% 墨色细描边，保证它在任何颜色的任务栏上都有边界。 -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#FBFAF9"/>
  <rect x="6.9" y="6.9" width="114.2" height="114.2" rx="27.2" fill="none"
        stroke="#16161A" stroke-opacity="0.18" stroke-width="1.8"/>

  <!-- 等重 Z：横杠厚 20，斜杠水平 31（31 × sin41° ≈ 20），两者视觉粗细一致。
       横杠满宽 + 斜杠 41°，是这种方块字唯一自洽的比例 —— 斜杠若走 45°，
       它的水平粗细必然是横杠的 2 倍（垂直粗细 1.41 倍），那是形状定死的，不是设计可选。
       斜杠中点恒为 (50,50)，橙点就落在这里：像对焦、像命中，也正好兑现站点
       "一处极窄色相的暖橙做点睛"那句。 -->
  <g transform="translate(21,21) scale(0.86)">
    <path d="M 0,0 L 100,0 L 100,20 L 31,80 L 100,80 L 100,100
             L 0,100 L 0,80 L 69,20 L 0,20 Z"
          fill="#16161A"/>
    <circle cx="50" cy="50" r="8" fill="#E16C28"/>
  </g>
</svg>
